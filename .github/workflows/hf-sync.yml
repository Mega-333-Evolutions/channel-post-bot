name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v3

      - name: Sync Code to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Clone your Hugging Face Space 
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/Mega-Evolutions/ButtonBot hf_space
          
          # 2. Go into the HF Space and delete everything EXCEPT .git, README.md, and .gitattributes
          cd hf_space
          find . -maxdepth 1 ! -name 'README.md' ! -name '.git' ! -name '.gitattributes' ! -name '.' -exec rm -rf {} +
          cd ..
          
          # 3. Copy everything from your GitHub repo into the HF Space 
          rsync -av --exclude='.git' --exclude='README.md' --exclude='.github' ./ hf_space/
          
          # 4. Setup Git LFS for binary files
          cd hf_space
          git lfs install
          git lfs track "*.jpg" "*.jpeg" "*.png" "*.ttf" "*.otf" "*.webp" "*.mp4" "*.mp3"
          
          # 5. Commit and push the updated files back to Hugging Face
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes
          git add .
          
          # Only attempt to commit if there are actual changes
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Automated sync from GitHub"
            git push
          fi
